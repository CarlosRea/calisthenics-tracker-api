name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag or version identifier (e.g., v1.0.0)'
        required: false
        default: 'latest'
        type: string
      confirm_promotion:
        description: 'Confirm promotion of tested release to production environment'
        required: true
        type: boolean
        default: false

jobs:
  promote-to-production:
    name: Manual Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify Manual Approval
        if: ${{ !inputs.confirm_promotion }}
        run: |
          echo "ERROR: Promotion cancelled. You must check 'confirm_promotion' to deploy to production."
          exit 1

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Launch Production Stack (docker-compose.prod.yaml)
        run: |
          echo "Promoting release '${{ inputs.release_tag }}' to production..."
          docker compose -f docker-compose.prod.yaml up --build -d

      - name: Validate Production Health Endpoint
        run: |
          echo "Validating production health check on port 8096..."
          timeout 60 bash -c 'until curl -sf http://localhost:8096/api/health; do sleep 2; done'
          echo "SUCCESS: Production release '${{ inputs.release_tag }}' is live and healthy on http://localhost:8096"
