name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to promote (YYYYMMDD-HHMMSS-shortsha or dev-latest)'
        required: true
        default: 'dev-latest'
        type: string
      confirm_promotion:
        description: 'Confirm promotion of tested dev image to production environment'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  promote-to-production:
    name: Manual Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify Manual Approval
        if: ${{ !inputs.confirm_promotion }}
        run: |
          echo "ERROR: Promotion cancelled. You must check 'confirm_promotion' to deploy to production."
          exit 1

      - uses: actions/checkout@v4

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Tested Image from Registry
        env:
          IMAGE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Pulling verified dev image: ${{ env.REGISTRY }}:${IMAGE_TAG}"
          docker pull ${{ env.REGISTRY }}:${IMAGE_TAG}

      - name: Launch Production Stack with Verified Image
        env:
          IMAGE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Promoting image ${{ env.REGISTRY }}:${IMAGE_TAG} to production on port 8096..."
          docker compose -f docker-compose.prod.yaml up -d

      - name: Validate Production Health Endpoint
        run: |
          echo "Validating production health check on port 8096..."
          timeout 60 bash -c 'until curl -sf http://localhost:8096/api/health; do sleep 2; done'
          echo "SUCCESS: Production release '${{ inputs.release_tag }}' is verified, healthy, and live on port 8096"
