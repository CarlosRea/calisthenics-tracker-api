name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write   # Required to push to GitHub Container Registry (GHCR)

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  # ==========================================
  # 1. Tests in Parallel
  # ==========================================
  backend-test:
    name: Backend Tests (FastAPI & Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: cd backend && uv sync

      - name: Run Pytest test suite
        run: cd backend && uv run pytest

  frontend-test:
    name: Frontend Tests (React & Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Compile frontend production assets
        run: cd frontend && npm run build

      - name: Run Vitest unit tests
        run: cd frontend && npm test

  # ==========================================
  # 2. Container Build & E2E Tests (Playwright)
  # ==========================================
  e2e-test:
    name: Build Compose Stack & Run E2E Tests
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & launch Docker Compose stack
        run: |
          docker compose up --build -d
          timeout 60 bash -c 'until curl -sf http://localhost:8095/api/health; do sleep 2; done'

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Chromium with system dependencies
        run: cd e2e && npx playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        run: cd e2e && npx playwright test

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose down -v

  # ==========================================
  # 3. Build & Push Tagged Container Image
  # ==========================================
  build-and-push:
    name: Build & Push Tagged Image
    needs: [e2e-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamped image tag (YYYYMMDD-HHMMSS-shortsha)
        id: meta
        run: |
          TAG="$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated Release Tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}:dev-latest

  # ==========================================
  # 4. Deploy to Development Environment
  # ==========================================
  deploy-dev:
    name: Deploy to Development
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Tagged Image and Serve Dev Stack
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "Pulling tested image: ${{ env.REGISTRY }}:${IMAGE_TAG}"
          docker pull ${{ env.REGISTRY }}:${IMAGE_TAG}
          docker compose up -d

      - name: Validate Dev Health Endpoint
        run: |
          echo "Validating Development health check on port 8095..."
          timeout 60 bash -c 'until curl -sf http://localhost:8095/api/health; do sleep 2; done'
          echo "SUCCESS: Development release ${{ needs.build-and-push.outputs.image_tag }} is live on port 8095"
