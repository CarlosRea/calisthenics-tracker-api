name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 1. Tests in Parallel
  # ==========================================
  backend-test:
    name: Backend Tests (FastAPI & Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: cd backend && uv sync

      - name: Run Pytest test suite
        run: cd backend && uv run pytest

  frontend-test:
    name: Frontend Tests (React & Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Compile frontend production assets
        run: cd frontend && npm run build

      - name: Run Vitest unit tests
        run: cd frontend && npm test

  # ==========================================
  # 2. Container Build & E2E Tests (Playwright)
  # ==========================================
  e2e-test:
    name: Build Compose Stack & Run E2E Tests
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & launch Docker Compose stack (FastAPI + PostgreSQL)
        run: |
          docker compose up --build -d
          timeout 60 bash -c 'until curl -sf http://localhost:8095/api/health; do sleep 2; done'

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Chromium with system dependencies
        run: cd e2e && npx playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        run: cd e2e && npx playwright test

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose down -v

  # ==========================================
  # 3. Release & Health Verification
  # ==========================================
  release:
    name: Release Build & Health Validation
    needs: [e2e-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        run: |
          docker build -t calisthenics-tracker:${{ github.sha }} .
          echo "Production image calisthenics-tracker:${{ github.sha }} built successfully."

      - name: Validate Release via Health Endpoint
        run: |
          echo "Starting production container to validate health endpoint..."
          docker run -d --rm -p 8095:8095 --name prod-check calisthenics-tracker:${{ github.sha }}
          sleep 4

          echo "Polling http://localhost:8095/api/health..."
          for i in {1..10}; do
            if curl -sf http://localhost:8095/api/health | grep -q "healthy"; then
              echo "Release health check PASSED!"
              docker stop prod-check
              exit 0
            fi
            echo "Attempt $i: waiting for service..."
            sleep 2
          done

          echo "ERROR: Health check failed."
          docker stop prod-check
          exit 1
