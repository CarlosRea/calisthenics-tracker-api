name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (FastAPI & Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Run backend tests
        run: cd backend && uv run pytest

  frontend-test:
    name: Frontend Tests (React & Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend production assets
        run: cd frontend && npm run build

      - name: Run Vitest test suite
        run: cd frontend && npm test

  e2e-test:
    name: Container Build & E2E Tests (Playwright & Compose)
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker Compose stack
        run: |
          docker compose up --build -d
          timeout 60 bash -c 'until curl -sf http://localhost:8095/api/health; do sleep 2; done'

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Playwright Chromium with dependencies
        run: cd e2e && npx playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        run: cd e2e && npx playwright test

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  deploy:
    name: Continuous Deployment
    needs: [e2e-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        run: docker build -t calisthenics-tracker:${{ github.sha }} .

      - name: Automated Deployment
        run: |
          echo "All unit, integration, and E2E tests passed."
          echo "Ready for zero-downtime deployment: calisthenics-tracker:${{ github.sha }}"
