services:
  db:
    image: postgres:16-alpine
    container_name: calisthenics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calisthenics
      POSTGRES_PASSWORD: calisthenics
      POSTGRES_DB: calisthenics
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calisthenics -d calisthenics"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  app:
    image: ${REGISTRY:-ghcr.io/carlosrea/calisthenics-tracker}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calisthenics-app
    restart: unless-stopped
    ports:
      - "8095:8095"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://calisthenics:calisthenics@db:5432/calisthenics
      PORT: "8095"
      STATIC_DIR: "/app/static"
      ENVIRONMENT: "development"
      SERVICE_VERSION: "1.0.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4318/v1/traces"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
