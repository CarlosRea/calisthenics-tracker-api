services:
  db:
    image: postgres:16-alpine
    container_name: calisthenics-db-prod
    restart: always
    environment:
      POSTGRES_USER: calisthenics_prod
      POSTGRES_PASSWORD: calisthenics_prod_secure_password
      POSTGRES_DB: calisthenics_prod
    ports:
      - "5435:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calisthenics_prod -d calisthenics_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  app:
    image: ${REGISTRY:-ghcr.io/carlosrea/calisthenics-tracker}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calisthenics-app-prod
    restart: always
    ports:
      - "8096:8095"
    environment:
      DATABASE_URL: postgresql://calisthenics_prod:calisthenics_prod_secure_password@db:5432/calisthenics_prod
      PORT: "8095"
      STATIC_DIR: "/app/static"
      ENVIRONMENT: "production"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_prod:
